name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Customize App Name (Messages), Global FinanceApp Theme & Modern Icon
        run: |
          python3 - << 'PYEOF'
          import os, glob, re

          # ۱. تغییر ایمن نام برنامه به Messages فقط در تگ app_name و فایل manifest
          for s_file in glob.glob("presentation/src/main/res/values*/strings.xml"):
              with open(s_file, "r") as f:
                  content = f.read()
              content = re.sub(r'(<string name="app_name">).*?(</string>)', r'\g<1>Messages\g<2>', content)
              with open(s_file, "w") as f:
                  f.write(content)

          manifest_file = "presentation/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_file):
              with open(manifest_file, "r") as f:
                  m = f.read()
              m = m.replace("4Messages", "Messages")
              with open(manifest_file, "w") as f:
                  f.write(m)

          # ۲. تبدیل رنگ‌های روشن و تاریک در colors.xml به سرمه‌ای تیره FinanceApp (#0B1220 و #111827)
          # این کار باعث می‌شود کل برنامه (حتی صفحه چت) بدون نیاز به تغییر تنظیمات، سرمه‌ای تیره و متن‌ها سفید باشند!
          colors_file = "presentation/src/main/res/values/colors.xml"
          if os.path.exists(colors_file):
              with open(colors_file, "r") as f:
                  c = f.read()
              c = re.sub(r'(<color name="backgroundLight">).*?(</color>)', r'\g<1>#0B1220\g<2>', c)
              c = re.sub(r'(<color name="backgroundDark">).*?(</color>)', r'\g<1>#0B1220\g<2>', c)
              c = re.sub(r'(<color name="bubbleLight">).*?(</color>)', r'\g<1>#111827\g<2>', c)
              c = re.sub(r'(<color name="bubbleDark">).*?(</color>)', r'\g<1>#111827\g<2>', c)
              c = re.sub(r'(<color name="textPrimary">).*?(</color>)', r'\g<1>#F9FAFB\g<2>', c)
              c = re.sub(r'(<color name="textSecondary">).*?(</color>)', r'\g<1>#D1D5DB\g<2>', c)
              c = re.sub(r'(<color name="textTertiary">).*?(</color>)', r'\g<1>#9CA3AF\g<2>', c)
              with open(colors_file, "w") as f:
                  f.write(c)

          # ۳. سفید کردن آیکون‌های ساعت و آنتن بالای گوشی در تمام استایل‌ها
          for style_file in glob.glob("presentation/src/main/res/values*/styles.xml"):
              with open(style_file, "r") as f:
                  s = f.read()
              s = s.replace('<item name="android:windowLightStatusBar">true</item>', '<item name="android:windowLightStatusBar">false</item>')
              s = s.replace('<item name="android:windowLightNavigationBar">true</item>', '<item name="android:windowLightNavigationBar">false</item>')
              with open(style_file, "w") as f:
                  f.write(s)

          # ۴. طراحی آیکون آبی یکدست و استاندارد (سازگار با تمام نسخه‌های اندروید بدون کرش)
          os.makedirs("presentation/src/main/res/drawable", exist_ok=True)
          os.makedirs("presentation/src/main/res/mipmap-anydpi-v26", exist_ok=True)

          bg_xml = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0284C7" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#0EA5E9" android:pathData="M0,0L108,0L108,54L0,74z"/>
          </vector>"""

          fg_xml = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,29C39.6,29 28,38.8 28,51c0,5.2 2.2,10 5.8,13.8L31,75l11.4,-4.2c3.6,1.4 7.5,2.2 11.6,2.2c14.4,0 26,-9.8 26,-22S68.4,29 54,29z"/>
              <path
                  android:fillColor="#0284C7"
                  android:pathData="M43,51m-3.2,0a3.2,3.2 0,1 1,6.4 0a3.2,3.2 0,1 1,-6.4 0"/>
              <path
                  android:fillColor="#0EA5E9"
                  android:pathData="M54,51m-3.2,0a3.2,3.2 0,1 1,6.4 0a3.2,3.2 0,1 1,-6.4 0"/>
              <path
                  android:fillColor="#22C55E"
                  android:pathData="M65,51m-3.2,0a3.2,3.2 0,1 1,6.4 0a3.2,3.2 0,1 1,-6.4 0"/>
          </vector>"""

          adaptive_xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg_custom"/>
              <foreground android:drawable="@drawable/ic_launcher_fg_custom"/>
          </adaptive-icon>"""

          with open("presentation/src/main/res/drawable/ic_launcher_bg_custom.xml", "w") as f:
              f.write(bg_xml)
          with open("presentation/src/main/res/drawable/ic_launcher_fg_custom.xml", "w") as f:
              f.write(fg_xml)

          for xml_file in glob.glob("presentation/src/main/res/mipmap-anydpi-v26/*.xml"):
              with open(xml_file, "w") as f:
                  f.write(adaptive_xml)
          PYEOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_LATEST_HOME
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/ndk-bundle" "$ANDROID_SDK_ROOT/ndk" "$ANDROID_SDK_ROOT/ndk-bundle" || true
          cat << 'EOF' > init.gradle
          gradle.projectsLoaded {
              rootProject.allprojects {
                  afterEvaluate { project ->
                      if (project.hasProperty('android')) {
                          project.android.packagingOptions {
                              doNotStrip "**/*.so"
                              doNotStrip "*/*.so"
                              doNotStrip "*/*/*.so"
                          }
                      }
                  }
              }
          }
          EOF
          ./gradlew assembleNoAnalyticsDebug --no-daemon --init-script init.gradle > build_log.txt 2>&1

      - name: Show Exact Error (If Failed)
        if: failure()
        run: |
          echo "=== COMPILATION ERRORS ==="
          grep -E "^e: |FAILURE:|What went wrong:|Execution failed|> " build_log.txt | tail -n 40 || true
          echo "=== LAST 40 LINES ==="
          tail -n 40 build_log.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Messages-APK
          path: "**/*.apk"
