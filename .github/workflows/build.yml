name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Apply Global Dark Theme, Telegram-Style Icon, App Name & Permissions
        run: |
          python3 - << 'PYEOF'
          import os, glob, re

          # ۱. تغییر نام برنامه به Messages در ریسورس‌ها و گریدل
          for s_file in glob.glob("**/src/**/res/values*/strings.xml", recursive=True):
              with open(s_file, "r") as f:
                  content = f.read()
              content = re.sub(r'(<string name="app_name"[^>]*>).*?(</string>)', r'\g<1>Messages\g<2>', content)
              content = content.replace("4Messages", "Messages").replace("5Messages", "Messages").replace("QKSMS", "Messages")
              with open(s_file, "w") as f:
                  f.write(content)

          for g_file in glob.glob("**/*.gradle", recursive=True):
              with open(g_file, "r") as f:
                  g = f.read()
              g = g.replace("4Messages", "Messages").replace("5Messages", "Messages")
              with open(g_file, "w") as f:
                  f.write(g)

          # ۲. تنظیم مانیفست: تغییر نام قطعی، رفع تداخل با tools:replace و افزودن مجوز اینترنت
          manifest_file = "presentation/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_file):
              with open(manifest_file, "r") as f:
                  m = f.read()
              
              m = re.sub(r'android:label="@string/[^"]+"', 'android:label="Messages"', m)
              m = m.replace("4Messages", "Messages")
              
              # افزودن فضای نام tools اگر وجود نداشت
              if "xmlns:tools=" not in m:
                  m = m.replace("<manifest", '<manifest xmlns:tools="http://schemas.android.com/tools"')
              
              # افزودن tools:replace="android:label" برای رفع تداخل نام در بیلد
              if "tools:replace=" not in m:
                  m = m.replace("<application", '<application tools:replace="android:label"')
              elif "android:label" not in m.split("tools:replace=")[1].split('"')[1]:
                  m = re.sub(r'(tools:replace=")([^"]*)(")', r'\1\2,android:label\3', m)

              # افزودن مجوز اینترنت
              if "android.permission.INTERNET" not in m:
                  m = m.replace("<application", '<uses-permission android:name="android.permission.INTERNET" />\n    <application')
                  
              with open(manifest_file, "w") as f:
                  f.write(m)

          # ۳. رنگ‌های اختصاصی حالت تاریک (حفظ کامل تم روشن و روز)
          colors_file = "presentation/src/main/res/values/colors.xml"
          if os.path.exists(colors_file):
              with open(colors_file, "r") as f:
                  c = f.read()
              c = re.sub(r'(<color name="backgroundDark">).*?(</color>)', r'\g<1>#0B1220\g<2>', c)
              c = re.sub(r'(<color name="bubbleDark">).*?(</color>)', r'\g<1>#111827\g<2>', c)
              with open(colors_file, "w") as f:
                  f.write(c)

          # ۴. طراحی آیکون طرح ۴ بهینه‌شده (موشک با حاشیه و ابعاد متناسب)
          os.makedirs("presentation/src/main/res/drawable", exist_ok=True)
          os.makedirs("presentation/src/main/res/mipmap-anydpi-v26", exist_ok=True)

          bg_xml = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#101214" android:pathData="M0,0h108v108h-108z"/>
          </vector>"""

          fg_xml = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#20232A"
                  android:pathData="M54,54m-28,0a28,28 0 1,0 56,0a28,28 0 1,0 -56,0"/>
              <path
                  android:fillColor="#94A3B8"
                  android:pathData="M49,59 L48.5,71 L55,63.5 Z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M71,37 L37,52 L49,59 L66,43 L53,61 L64,69 L71,37 Z"/>
          </vector>"""

          adaptive_xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg_custom"/>
              <foreground android:drawable="@drawable/ic_launcher_fg_custom"/>
          </adaptive-icon>"""

          with open("presentation/src/main/res/drawable/ic_launcher_bg_custom.xml", "w") as f:
              f.write(bg_xml)
          with open("presentation/src/main/res/drawable/ic_launcher_fg_custom.xml", "w") as f:
              f.write(fg_xml)

          for xml_file in glob.glob("presentation/src/main/res/mipmap-anydpi-v26/*.xml"):
              with open(xml_file, "w") as f:
                  f.write(adaptive_xml)
          PYEOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: |
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK_LATEST_HOME
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/ndk-bundle" "$ANDROID_SDK_ROOT/ndk" "$ANDROID_SDK_ROOT/ndk-bundle" || true
          cat << 'EOF' > init.gradle
          gradle.projectsLoaded {
              rootProject.allprojects {
                  afterEvaluate { project ->
                      if (project.hasProperty('android')) {
                          project.android.packagingOptions {
                              doNotStrip "**/*.so"
                              doNotStrip "*/*.so"
                              doNotStrip "*/*/*.so"
                          }
                      }
                  }
              }
          }
          EOF
          ./gradlew assembleNoAnalyticsDebug --no-daemon --init-script init.gradle > build_log.txt 2>&1

      - name: Show Exact Error (If Failed)
        if: failure()
        run: |
          echo "=== COMPILATION ERRORS ==="
          grep -E "^e: |FAILURE:|What went wrong:|Execution failed|> " build_log.txt | tail -n 40 || true
          echo "=== LAST 40 LINES ==="
          tail -n 40 build_log.txt

      - name: Sign APK with Permanent Keystore
        if: success()
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -name "34.*" -o -name "33.*" -o -name "30.*" | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS" ]; then
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          fi
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          RAW_APK=$(find presentation/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found raw APK: $RAW_APK"
          mkdir -p signed_out
          $ZIPALIGN -f -p 4 "$RAW_APK" signed_out/aligned.apk
          $APKSIGNER sign --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --ks signing/release.keystore --ks-key-alias mecav \
            --ks-pass pass:mecavworkshop --key-pass pass:mecavworkshop \
            --out signed_out/5Messages.apk signed_out/aligned.apk
          $APKSIGNER verify --verbose signed_out/5Messages.apk

      - name: Create or Update GitHub Release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="1.3.5"
          TAG_NAME="v${VERSION_NAME}"
          gh release delete "$TAG_NAME" --yes || true
          git tag -d "$TAG_NAME" || true
          git push origin ":refs/tags/$TAG_NAME" || true
          gh release create "$TAG_NAME" signed_out/5Messages.apk \
            --title "5Messages v${VERSION_NAME}" \
            --notes "نسخه 1.3.5: رفع ارسال دوتایی پیام‌ها در وب‌کلاینت و حل مشکل انتخاب سیم‌کارت فعال در گوشی‌های دو سیم‌کارته" \
            --latest || gh release upload "$TAG_NAME" signed_out/5Messages.apk --clobber

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Messages-APK
          path: signed_out/5Messages.apk
