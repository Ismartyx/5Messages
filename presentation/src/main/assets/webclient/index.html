<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>5Messages Web</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", Tahoma, sans-serif;
      background-color: #0B0F19;
      color: #F8FAFC;
      height: 100vh;
      display: flex;
      overflow: hidden;
      user-select: none;
    }
    
    /* Layout */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
    }
    
    /* Sidebar */
    .sidebar {
      width: 360px;
      min-width: 300px;
      background-color: #111827;
      border-left: 1px solid #1F2937;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .sidebar-header {
      padding: 16px;
      background-color: #111827;
      border-bottom: 1px solid #1F2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      color: #38BDF8;
    }
    .brand svg { width: 26px; height: 26px; fill: #38BDF8; }
    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      background: #1E293B;
      padding: 4px 10px;
      border-radius: 12px;
      color: #10B981;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #10B981;
      box-shadow: 0 0 8px #10B981;
    }
    .search-box {
      padding: 10px 16px;
      background-color: #111827;
      border-bottom: 1px solid #1F2937;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      background: #1F2937;
      border: 1px solid #374151;
      border-radius: 10px;
      color: #F8FAFC;
      font-size: 14px;
      outline: none;
    }
    .search-input:focus { border-color: #38BDF8; }
    
    .conv-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
    }
    .conv-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #1F2937;
      cursor: pointer;
      transition: background 0.15s;
      gap: 12px;
    }
    .conv-item:hover { background-color: #1E293B; }
    .conv-item.active { background-color: #1E293B; border-right: 4px solid #38BDF8; }
    
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #0284C7;
      color: #FFF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .conv-details {
      flex: 1;
      min-width: 0;
    }
    .conv-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .conv-title {
      font-size: 15px;
      font-weight: 600;
      color: #F3F4F6;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .conv-time {
      font-size: 11px;
      color: #9CA3AF;
      flex-shrink: 0;
    }
    .conv-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .conv-snippet {
      font-size: 13px;
      color: #9CA3AF;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .unread-pill {
      background-color: #0284C7;
      color: #FFF;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
      margin-right: 6px;
    }

    /* Main Chat Panel */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: #0B0F19;
      height: 100%;
      position: relative;
    }
    .chat-header {
      padding: 14px 20px;
      background-color: #111827;
      border-bottom: 1px solid #1F2937;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-header-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-title {
      font-size: 16px;
      font-weight: 700;
      color: #F9FAFB;
    }
    .chat-subtitle {
      font-size: 12px;
      color: #9CA3AF;
    }
    .chat-header-actions {
      display: flex;
      gap: 10px;
    }
    .action-btn {
      background: #1F2937;
      border: 1px solid #374151;
      color: #D1D5DB;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.15s;
    }
    .action-btn:hover { background: #374151; color: #FFF; }
    
    .messages-container {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      user-select: text;
    }
    .empty-state {
      margin: auto;
      text-align: center;
      color: #6B7280;
    }
    .empty-state svg { width: 64px; height: 64px; fill: #374151; margin-bottom: 12px; }
    
    /* Message Bubbles */
    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 65%;
      position: relative;
    }
    .msg-row.in {
      align-self: flex-start;
    }
    .msg-row.out {
      align-self: flex-end;
    }
    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      position: relative;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg-row.in .bubble {
      background-color: #1E293B;
      color: #F8FAFC;
      border-bottom-right-radius: 4px;
      border: 1px solid #334155;
    }
    .msg-row.out .bubble {
      background-color: #0284C7;
      color: #FFFFFF;
      border-bottom-left-radius: 4px;
    }
    .msg-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 10px;
      color: #94A3B8;
      margin-top: 4px;
      padding: 0 4px;
    }
    .msg-row.out .msg-meta { justify-content: flex-end; }
    .copy-chip-btn {
      cursor: pointer;
      color: #38BDF8;
      text-decoration: underline;
      font-size: 11px;
      background: none;
      border: none;
    }

    /* Input Footer */
    .chat-footer {
      padding: 14px 20px;
      background-color: #111827;
      border-top: 1px solid #1F2937;
      display: flex;
      gap: 12px;
      align-items: flex-end;
    }
    .msg-input {
      flex: 1;
      padding: 12px 16px;
      background: #1F2937;
      border: 1px solid #374151;
      border-radius: 12px;
      color: #F8FAFC;
      font-size: 14px;
      outline: none;
      resize: none;
      max-height: 120px;
      min-height: 44px;
      line-height: 1.4;
      font-family: inherit;
    }
    .msg-input:focus { border-color: #38BDF8; }
    .send-btn {
      background-color: #0284C7;
      border: none;
      color: #FFF;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .send-btn:hover { background-color: #0369A1; }
    .send-btn svg { width: 20px; height: 20px; fill: #FFF; }
    
    /* Login Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-card {
      background: #111827;
      border: 1px solid #1F2937;
      border-radius: 20px;
      padding: 32px;
      width: 380px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-icon {
      width: 60px;
      height: 60px;
      background: #1E293B;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      color: #38BDF8;
    }
    .modal-icon svg { width: 32px; height: 32px; fill: #38BDF8; }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; color: #F9FAFB; }
    .modal-subtitle { font-size: 13px; color: #9CA3AF; margin-bottom: 24px; line-height: 1.5; }
    .pin-input {
      width: 100%;
      padding: 14px;
      background: #1F2937;
      border: 1px solid #374151;
      border-radius: 12px;
      color: #FFF;
      font-size: 20px;
      text-align: center;
      letter-spacing: 6px;
      outline: none;
      margin-bottom: 16px;
    }
    .pin-input:focus { border-color: #38BDF8; }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: #0284C7;
      border: none;
      border-radius: 12px;
      color: #FFF;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .login-btn:hover { background: #0369A1; }
    .error-msg { color: #EF4444; font-size: 13px; margin-top: 10px; display: none; }
    
    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #4B5563; }
  </style>
</head>
<body>

  <!-- Lock Modal -->
  <div id="loginModal" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
      </div>
      <div class="modal-title">ورود امن به 5Messages</div>
      <div class="modal-subtitle">پین‌کد امنیتی نمایش داده شده در تنظیمات وب‌کلاینت گوشی را وارد کنید:</div>
      <input type="password" id="pinInput" class="pin-input" placeholder="••••" maxlength="8" autofocus autocomplete="off">
      <button id="loginBtn" class="login-btn" onclick="submitLogin()">ورود به برنامه</button>
      <div id="errorMsg" class="error-msg">پین‌کد اشتباه است!</div>
    </div>
  </div>

  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
          <span>5Messages</span>
        </div>
        <div class="status-badge">
          <div class="status-dot"></div>
          <span>متصل (Tailscale)</span>
        </div>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="جستجو در مخاطبین و پیام‌ها..." oninput="filterConversations()">
      </div>
      <ul id="convList" class="conv-list"></ul>
    </div>

    <!-- Main Chat Area -->
    <div class="chat-panel">
      <div id="chatHeader" class="chat-header" style="display: none;">
        <div class="chat-header-info">
          <div id="headerAvatar" class="avatar"></div>
          <div>
            <div id="headerTitle" class="chat-title"></div>
            <div id="headerAddress" class="chat-subtitle"></div>
          </div>
        </div>
        <div class="chat-header-actions">
          <button class="action-btn" onclick="requestNotificationPermission()">🔔 اعلان ویندوز</button>
          <button class="action-btn" onclick="logout()">خروج</button>
        </div>
      </div>

      <div id="messagesContainer" class="messages-container">
        <div class="empty-state">
          <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/></svg>
          <p>یک گفتگو را از منوی سمت راست برای مشاهده و ارسال انتخاب کنید</p>
        </div>
      </div>

      <div id="chatFooter" class="chat-footer" style="display: none;">
        <textarea id="msgInput" class="msg-input" placeholder="نوشتن پیامک..." rows="1" onkeydown="handleInputKey(event)"></textarea>
        <button class="send-btn" onclick="sendMessage()" title="ارسال (Enter)">
          <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('5m_token') || '';
    let currentThreadId = null;
    let currentAddress = '';
    let conversations = [];
    let messages = [];
    let lastPollDate = Date.now();
    let pollInterval = null;

    window.onload = function() {
      if (!token) {
        showLoginModal();
      } else {
        verifyAuth();
      }
    };

    function showLoginModal() {
      document.getElementById('loginModal').style.display = 'flex';
      document.getElementById('pinInput').focus();
    }

    async function submitLogin() {
      const pin = document.getElementById('pinInput').value.trim();
      const err = document.getElementById('errorMsg');
      err.style.display = 'none';
      if (!pin) return;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: pin })
        });
        const data = await res.json();
        if (data.success && data.token) {
          token = data.token;
          localStorage.setItem('5m_token', token);
          document.getElementById('loginModal').style.display = 'none';
          initApp();
        } else {
          err.style.display = 'block';
        }
      } catch (e) {
        err.innerText = 'خطا در برقراری ارتباط با گوشی!';
        err.style.display = 'block';
      }
    }

    async function verifyAuth() {
      try {
        const res = await fetch('/api/status', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.status === 401) {
          localStorage.removeItem('5m_token');
          token = '';
          showLoginModal();
        } else {
          initApp();
        }
      } catch (e) {
        initApp();
      }
    }

    function initApp() {
      loadConversations();
      if (!pollInterval) {
        pollInterval = setInterval(pollNewMessages, 2500);
      }
    }

    function logout() {
      localStorage.removeItem('5m_token');
      token = '';
      location.reload();
    }

    async function loadConversations() {
      try {
        const res = await fetch('/api/conversations', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        conversations = await res.json();
        renderConversations(conversations);
      } catch (e) {
        console.error("Failed to load conversations", e);
      }
    }

    function renderConversations(list) {
      const el = document.getElementById('convList');
      el.innerHTML = '';
      list.forEach(c => {
        const li = document.createElement('li');
        li.className = 'conv-item' + (c.id === currentThreadId ? ' active' : '');
        li.onclick = () => selectConversation(c);
        
        const avatarLetter = (c.title || c.address || '?').trim().charAt(0);
        const timeStr = formatTime(c.date);
        
        li.innerHTML = `
          <div class="avatar">` + escapeHtml(avatarLetter) + `</div>
          <div class="conv-details">
            <div class="conv-top">
              <span class="conv-title">` + escapeHtml(c.title || c.address || 'بدون نام') + `</span>
              <span class="conv-time">` + timeStr + `</span>
            </div>
            <div class="conv-bottom">
              <span class="conv-snippet">` + escapeHtml(c.snippet || '') + `</span>
              ` + (c.unread ? '<span class="unread-pill">جدید</span>' : '') + `
            </div>
          </div>
        `;
        el.appendChild(li);
      });
    }

    function filterConversations() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) {
        renderConversations(conversations);
        return;
      }
      const filtered = conversations.filter(c => 
        (c.title && c.title.toLowerCase().includes(q)) ||
        (c.address && c.address.includes(q)) ||
        (c.snippet && c.snippet.toLowerCase().includes(q))
      );
      renderConversations(filtered);
    }

    async function selectConversation(c) {
      currentThreadId = c.id;
      currentAddress = c.address || '';
      renderConversations(conversations);

      document.getElementById('chatHeader').style.display = 'flex';
      document.getElementById('chatFooter').style.display = 'flex';
      document.getElementById('headerTitle').innerText = c.title || c.address || 'بدون نام';
      document.getElementById('headerAddress').innerText = c.address || '';
      document.getElementById('headerAvatar').innerText = (c.title || c.address || '?').trim().charAt(0);

      loadMessages(currentThreadId);
      document.getElementById('msgInput').focus();
    }

    async function loadMessages(threadId) {
      const container = document.getElementById('messagesContainer');
      container.innerHTML = '<div class="empty-state"><p>در حال بارگذاری پیام‌ها...</p></div>';

      try {
        const res = await fetch('/api/messages?threadId=' + threadId, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        messages = await res.json();
        renderMessages(messages);
      } catch (e) {
        container.innerHTML = '<div class="empty-state"><p>خطا در بارگذاری پیام‌ها!</p></div>';
      }
    }

    function renderMessages(list) {
      const container = document.getElementById('messagesContainer');
      container.innerHTML = '';
      if (!list || list.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>هنوز پیامی وجود ندارد</p></div>';
        return;
      }

      list.forEach(m => {
        const row = document.createElement('div');
        row.className = 'msg-row ' + (m.isMe ? 'out' : 'in');
        
        const timeStr = formatFullTime(m.date);
        row.innerHTML = `
          <div class="bubble">` + escapeHtml(m.body) + `</div>
          <div class="msg-meta">
            <span>` + timeStr + `</span>
            <button class="copy-chip-btn" onclick="copyText('` + escapeQuotes(m.body) + `')">کپی</button>
          </div>
        `;
        container.appendChild(row);
      });

      container.scrollTop = container.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text || !currentThreadId) return;

      input.value = '';
      
      messages.push({
        id: Date.now(),
        body: text,
        date: Date.now(),
        isMe: true
      });
      renderMessages(messages);

      try {
        const res = await fetch('/api/send', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({
            threadId: currentThreadId,
            address: currentAddress,
            body: text
          })
        });
        const data = await res.json();
        if (!data.success) {
          alert('خطا در ارسال پیامک از طریق گوشی: ' + (data.error || 'نامشخص'));
        }
      } catch (e) {
        alert('خطای اتصال به سرور گوشی: ' + (e.message || e));
      }
    }

    function handleInputKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    async function pollNewMessages() {
      try {
        const res = await fetch('/api/poll?since=' + lastPollDate, {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.status === 200) {
          const newItems = await res.json();
          if (newItems && newItems.length > 0) {
            lastPollDate = Date.now();
            newItems.forEach(msg => {
              if (!msg.isMe) {
                notifyDesktop(msg.address || 'پیامک جدید', msg.body);
              }
              if (currentThreadId && msg.threadId === currentThreadId) {
                messages.push(msg);
                renderMessages(messages);
              }
            });
            loadConversations();
          }
        }
      } catch (e) {
        // Ignore polling errors
      }
    }

    function requestNotificationPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(p => {
          if (p === 'granted') {
            new Notification('5Messages Web', { body: 'اعلان‌های دسکتاپ با موفقیت فعال شد!' });
          }
        });
      }
    }

    function notifyDesktop(title, body) {
      if ('Notification' in window && Notification.permission === 'granted') {
        new Notification(title, { body: body });
      }
    }

    function copyText(str) {
      navigator.clipboard.writeText(str);
    }

    function formatTime(timestamp) {
      if (!timestamp) return '';
      const d = new Date(timestamp);
      return d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
    }

    function formatFullTime(timestamp) {
      if (!timestamp) return '';
      const d = new Date(timestamp);
      return d.toLocaleDateString('fa-IR') + ' ' + d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeQuotes(str) {
      if (!str) return '';
      return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"').replace(/\n/g, '\\n');
    }
  </script>
</body>
</html>
